

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rody & Gouda</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f5f3ef;color:#282d3a;
 font-family:Arial,Tahoma,sans-serif;
}
main{
 min-height:100vh;display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:16px;
}
header{width:min(800px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.logo{font-weight:800;font-size:19px;letter-spacing:-1px}
.logo span{color:#e77e9c}
.scorebox{text-align:left;font-size:12px;color:#777}
#score{font-size:23px;font-weight:bold;color:#282d3a}
.game{
 position:relative;width:min(800px,100%);
 border-radius:18px;overflow:hidden;
 box-shadow:0 12px 35px #31334215;background:#e8f1ed;
}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
#overlay{
 position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;background:#f5f3efcf;padding:18px;
}
.panel{text-align:center;max-width:330px}
.avatar{font-size:36px;margin-bottom:10px}
h1{font-size:28px;margin:8px 0}
h1 span{color:#e77e9c}
p{font-size:14px;line-height:1.9;color:#686d79}
button{
 border:0;border-radius:10px;padding:13px 25px;
 background:#e77e9c;color:white;font-weight:bold;
 font-size:15px;cursor:pointer;
}
button:active{transform:scale(.97)}
.hint{font-size:11px;color:#92939b;margin-top:14px}
footer{width:min(800px,100%);display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:12px}
footer span{font-size:11px;color:#858691}
#jumpBtn{padding:12px 24px;touch-action:manipulation}
@media(max-width:480px){
 main{padding:12px}
 header{margin-bottom:12px}
 .logo{font-size:16px}
 #score{font-size:20px}
 footer{margin-top:12px}
}
</style>
</head>
<body>
<main>
<header>
 <div class="logo">RODY <span>&</span> GOUDA</div>
 <div class="scorebox">
  <div>النتيجه</div>
  <div id="score">00000</div>
 </div>
</header>

<div class="game">
 <canvas id="game" width="800" height="400"></canvas>
 <div id="overlay">
  <div class="panel">
   <div class="avatar"></div>
   <h1 id="title">Rody <span>&</span> Gouda</h1>
   <p id="desc"><br><br>انا دماغي باظت عشان اعمل حاجه حلوه و في الاخر دي النتيحه النهائيه</p>
   <button id="start">الاستارت اهو</button>
   <div class="hint"></div>
  </div>
 </div>
</div>

<footer>
 <span id="best">اسكورك اهو بردو 00000</span>
 <button id="jumpBtn">jump</button>
</footer>
</main>

<script>
(function(){
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const overlay=document.getElementById("overlay");
const startBtn=document.getElementById("start");
const title=document.getElementById("title");
const desc=document.getElementById("desc");
const jumpBtn=document.getElementById("jumpBtn");

const W=800,H=400,ground=320;
let state="ready",score=0,best=0,speed=5;
let last=0,time=0,spawn=0,groundMove=0;
let obstacles=[],clouds=[];
let animationId=0;

try{best=Number(localStorage.getItem("rg-best"))||0}catch(e){}
bestEl.textContent="افضل نتيجه "+String(best).padStart(5,"0");

const girl={x:145,y:ground-54,w:30,h:54,vy:0,grounded:true};
const boy={x:95};

for(let i=0;i<6;i++){
 clouds.push({x:i*180+30,y:40+(i%3)*35,s:0.7+(i%3)*0.15});
}

function box(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(x,y,w,h);
}

function roundRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawBackground(){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#e4f1ec");
 sky.addColorStop(1,"#f8e9e5");
 box(0,0,W,H,sky);

 // Sun
 ctx.fillStyle="#f5d6a3";
 ctx.beginPath();
 ctx.arc(675,80,30,0,Math.PI*2);
 ctx.fill();

 // Clouds
 clouds.forEach(c=>{
  ctx.fillStyle="#ffffffa8";
  ctx.beginPath();
  ctx.ellipse(c.x,c.y,29*c.s,10*c.s,0,0,Math.PI*2);
  ctx.ellipse(c.x-15*c.s,c.y+4*c.s,17*c.s,9*c.s,0,0,Math.PI*2);
  ctx.ellipse(c.x+15*c.s,c.y+4*c.s,17*c.s,9*c.s,0,0,Math.PI*2);
  ctx.fill();
 });

 // Distant hills
 ctx.fillStyle="#c8ded3";
 ctx.beginPath();
 ctx.moveTo(0,280);
 for(let x=0;x<=W;x+=100){
  ctx.quadraticCurveTo(x+50,225+(x%3)*8,x+100,280);
 }
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

 ctx.fillStyle="#a9cdbb";
 ctx.beginPath();
 ctx.moveTo(0,300);
 for(let x=0;x<=W;x+=120){
  ctx.quadraticCurveTo(x+60,255,x+120,300);
 }
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

 // Ground
 box(0,ground,W,H-ground,"#f3e5db");
 box(0,ground,W,4,"#9ebfae");

 for(let x=-(groundMove%55);x<W;x+=55){
  box(x,ground+23,23,3,"#d7c9c0");
  box(x+30,ground+43,10,3,"#d7c9c0");
 }
}

function drawPerson(x,y,isGirl,jumping){
 // Shadow
 ctx.globalAlpha=.13;
 ctx.fillStyle="#343847";
 ctx.beginPath();
 ctx.ellipse(x+15,ground+2,18,4,0,0,Math.PI*2);
 ctx.fill();
 ctx.globalAlpha=1;

 ctx.save();
 ctx.translate(x,y);

 // Hair behind head
 roundRect(4,2,23,20,8,isGirl?"#463544":"#343648");

 // Head
 roundRect(6,5,20,21,7,isGirl?"#f2c4a7":"#dfb08e");

 // Hair fringe
 roundRect(4,3,22,8,5,isGirl?"#463544":"#343648");
 box(4,8,4,9,isGirl?"#463544":"#343648");

 if(isGirl){
  // Hair at the back
  roundRect(23,11,6,19,3,"#463544");
  // Hair bow
  box(4,4,7,5,"#e77e9c");
 }

 // Eyes
 box(11,14,2,2,"#34303b");
 box(21,14,2,2,"#34303b");
 box(15,20,5,1,"#c27c7b");

 // Body
 roundRect(4,27,23,16,5,isGirl?"#e77e9c":"#729ed0");

 // Arms
 roundRect(0,29,6,15,3,isGirl?"#f2c4a7":"#dfb08e");
 roundRect(26,29,6,15,3,isGirl?"#f2c4a7":"#dfb08e");

 // Legs
 const step=Math.sin(time*.02);
 ctx.fillStyle=isGirl?"#635b88":"#465575";

 if(jumping){
  roundRect(7,41,7,9,3,ctx.fillStyle);
  roundRect(19,41,7,9,3,ctx.fillStyle);
  roundRect(3,47,12,5,3,"#fff");
  roundRect(18,47,12,5,3,"#fff");
 }else{
  roundRect(7,41,7,10,3,ctx.fillStyle);
  roundRect(19,41,7,10,3,ctx.fillStyle);

  if(step>0){
   roundRect(3,48,12,5,3,"#fff");
   roundRect(19,46,12,5,3,"#fff");
  }else{
   roundRect(7,46,12,5,3,"#fff");
   roundRect(16,48,12,5,3,"#fff");
  }
 }

 ctx.restore();
}

function drawObstacle(o){
 if(o.type===0){
  // Simple tree stump
  roundRect(o.x,o.y,o.w,o.h,5,"#99745f");
  roundRect(o.x-5,o.y-5,o.w+10,11,5,"#6e9b7b");
  roundRect(o.x+5,o.y-12,o.w-2,13,5,"#85b595");
 }else{
  // Rock
  ctx.fillStyle="#8e9aab";
  ctx.beginPath();
  ctx.moveTo(o.x,o.y+o.h);
  ctx.lineTo(o.x+4,o.y+8);
  ctx.lineTo(o.x+o.w*.45,o.y);
  ctx.lineTo(o.x+o.w-3,o.y+10);
  ctx.lineTo(o.x+o.w,o.y+o.h);
  ctx.closePath();
  ctx.fill();
 }
}

function draw(){
 drawBackground();

 obstacles.forEach(drawObstacle);

 // Gouda follows the same jump state as Rody
 drawPerson(boy.x,girl.y,false,!girl.grounded);
 drawPerson(girl.x,girl.y,true,!girl.grounded);

 // Labels
 ctx.textAlign="center";
 ctx.font="bold 11px Arial";
 ctx.fillStyle="#fff";
 ctx.fillText("Gouda",boy.x+15,girl.y-8);
 ctx.fillStyle="#d65d86";
 ctx.fillText("Rody",girl.x+15,girl.y-8);
}

function reset(){
 score=0;speed=5;time=0;spawn=40;groundMove=0;
 obstacles=[];
 girl.y=ground-girl.h;
 girl.vy=0;girl.grounded=true;
 boy.x=girl.x-50;
 scoreEl.textContent="00000";
}

function start(){
 cancelAnimationFrame(animationId);
 reset();
 state="playing";
 overlay.style.display="none";
 last=performance.now();
 animationId=requestAnimationFrame(loop);
}

function jump(){
 if(state==="ready"||state==="over"){
  start();
  return;
 }

 if(state==="playing"&&girl.grounded){
  girl.vy=-12.5;
  girl.grounded=false;
 }
}

function finish(){
 state="over";

 if(score>best){
  best=score;
  try{localStorage.setItem("rg-best",String(best))}catch(e){}
 }

 bestEl.textContent=""+String(best).padStart(5,"0");
 title.innerHTML=" <span>♥</span>";
 desc.innerHTML=" "+score+" <br> معلش تعالي علي نفسك هي اللعبه بعافيه شويه<br>";
 startBtn.textContent="جربي تاني انت كد كدا هتخسري";
 overlay.style.display="flex";
}

function update(dt){
 const f=Math.min(dt/16.667,2);
 time+=dt;
 speed=Math.min(10,5+score/500);
 groundMove+=speed*f;
 score=Math.floor(time/100);
 scoreEl.textContent=String(score).padStart(5,"0");

 clouds.forEach(c=>{
  c.x-=speed*.12*f;
  if(c.x<-50)c.x=W+40;
 });

 girl.vy+=.65*f;
 girl.y+=girl.vy*f;

 if(girl.y>=ground-girl.h){
  girl.y=ground-girl.h;
  girl.vy=0;
  girl.grounded=true;
 }

 // Gouda follows Rody and copies every jump
 boy.x=girl.x-50;

 spawn-=f;
 if(spawn<=0){
  const type=Math.random()<.55?0:1;
  const h=type===0?36:27;
  obstacles.push({
   x:W+20,
   y:ground-h,
   w:type===0?25:30,
   h,
   type
  });
  spawn=65+Math.random()*40;
 }

 obstacles.forEach(o=>o.x-=speed*f);
 obstacles=obstacles.filter(o=>o.x+o.w>-10);

 // Rody's jump determines the run; Gouda mirrors the same pose
 for(const o of obstacles){
  const hitX=girl.x+girl.w-5>o.x+4&&girl.x+5<o.x+o.w-4;
  const hitY=girl.y+girl.h-4>o.y+3;

  if(hitX&&hitY){
   finish();
   return;
  }
 }
}

function loop(now){
 if(state!=="playing")return;

 const dt=Math.min(now-last,40);
 last=now;

 update(dt);
 draw();

 if(state==="playing"){
  animationId=requestAnimationFrame(loop);
 }
}

startBtn.addEventListener("click",start);
jumpBtn.addEventListener("pointerdown",e=>{
 e.preventDefault();
 jump();
});

canvas.addEventListener("pointerdown",()=>{
 jump();
});

window.addEventListener("keydown",e=>{
 if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){
  e.preventDefault();
  if(!e.repeat)jump();
 }
});

window.addEventListener("blur",()=>{
 if(state==="playing")last=performance.now();
});

draw();
})();
</script>
</body>
</html>
